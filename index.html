<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIBBOR - Estilo y Elegancia</title>
    
    <!-- PWA Config & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#022c22">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Tailwind Config & CDN -->
    <script>
        window.tailwind = { config: { suppressWarnings: true } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between selection:bg-emerald-800 selection:text-white">

    <!-- Navbar -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-100 shadow-sm transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                
                <!-- Logo -->
                <div class="flex-shrink-0 cursor-pointer flex items-center gap-3" onclick="navigateTo('inicio')">
                    <div class="w-10 h-10 rounded-full bg-emerald-900 flex items-center justify-center text-amber-400 font-serif font-bold text-xl shadow-md border border-amber-500/30">
                        G
                    </div>
                    <div>
                        <span class="font-serif text-2xl font-bold tracking-tight text-emerald-950 block leading-none">GIBBOR</span>
                        <span class="text-[9px] tracking-[0.25em] text-amber-700 font-semibold uppercase block mt-1">Estilo y Elegancia</span>
                    </div>
                </div>

                <!-- Desktop Navigation Links -->
                <nav class="hidden md:flex space-x-8 font-medium text-sm">
                    <button onclick="navigateTo('inicio')" id="nav-inicio" class="nav-btn text-emerald-900 border-b-2 border-emerald-800 px-1 py-1 transition-colors">
                        Inicio
                    </button>
                    <button onclick="navigateTo('productos')" id="nav-productos" class="nav-btn text-slate-600 hover:text-emerald-800 border-b-2 border-transparent hover:border-emerald-800/40 px-1 py-1 transition-colors">
                        Productos
                    </button>
                    <button onclick="navigateTo('politicas')" id="nav-politicas" class="nav-btn text-slate-600 hover:text-emerald-800 border-b-2 border-transparent hover:border-emerald-800/40 px-1 py-1 transition-colors">
                        Políticas
                    </button>
                    <!-- Admin Link (sólo para administradores) -->
                    <button id="nav-admin" onclick="navigateTo('admin')" class="hidden nav-btn text-amber-600 font-bold border-b-2 border-transparent hover:border-amber-600 px-1 py-1 transition-colors">
                        Admin
                    </button>
                </nav>

                <!-- Actions, Cart & User Auth -->
                <div class="flex items-center space-x-3">
                    <button onclick="toggleCartModal()" class="relative p-2.5 text-slate-700 hover:text-emerald-900 transition-colors rounded-full hover:bg-slate-100 focus:outline-none" aria-label="Carrito">
                        <i data-lucide="shopping-bag" class="w-6 h-6"></i>
                        <span id="cart-badge" class="hidden absolute -top-1 -right-1 bg-amber-500 text-emerald-950 text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center border-2 border-white shadow-sm">
                            0
                        </span>
                    </button>

                    <!-- Auth Button / Avatar -->
                    <div id="auth-container">
                        <button id="btn-login" onclick="openAuthModal()" class="px-4 py-2 bg-emerald-900 hover:bg-emerald-950 text-white text-xs font-bold rounded-full transition-colors">
                            Ingresar
                        </button>
                        <div id="user-profile" class="hidden flex items-center gap-2">
                            <img id="user-avatar" class="w-8 h-8 rounded-full border border-amber-500" src="" alt="Avatar">
                            <button onclick="logoutGoogle()" class="text-xs text-slate-500 hover:text-red-600 font-semibold">Salir</button>
                        </div>
                    </div>

                    <button onclick="toggleMobileMenu()" class="md:hidden p-2 text-slate-700 hover:text-emerald-900 focus:outline-none" aria-label="Menu">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-b border-slate-200 px-4 pt-2 pb-4 space-y-2">
            <button onclick="navigateTo('inicio'); toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-slate-700 hover:text-emerald-900 hover:bg-slate-50">
                Inicio
            </button>
            <button onclick="navigateTo('productos'); toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-slate-700 hover:text-emerald-900 hover:bg-slate-50">
                Productos
            </button>
            <button onclick="navigateTo('politicas'); toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-slate-700 hover:text-emerald-900 hover:bg-slate-50">
                Políticas
            </button>
            <button id="mobile-nav-admin" onclick="navigateTo('admin'); toggleMobileMenu()" class="hidden text-amber-600 font-bold block w-full text-left px-3 py-2 rounded-md text-base hover:bg-amber-50">
                Administración
            </button>
        </div>
    </header>

    <!-- PWA Banners -->
    <div id="pwa-install-banner" class="hidden bg-emerald-950 text-white px-4 py-3 border-b border-emerald-800 transition-all">
        <div class="max-w-7xl mx-auto flex items-center justify-between text-xs sm:text-sm">
            <div class="flex items-center gap-2">
                <i data-lucide="smartphone" class="w-4 h-4 text-amber-400"></i>
                <span>Instalá la app de <strong>GIBBOR</strong> para acceder más rápido.</span>
            </div>
            <div class="flex items-center gap-3">
                <button id="pwa-install-btn" onclick="installPWA()" class="px-3.5 py-1 bg-amber-500 hover:bg-amber-400 text-emerald-950 font-bold rounded-full transition-colors text-xs shadow-sm">
                    Instalar
                </button>
                <button onclick="dismissPWAInstall()" class="text-slate-400 hover:text-white p-1">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="pwa-update-banner" class="hidden fixed bottom-4 right-4 z-50 bg-emerald-950 text-white px-5 py-4 rounded-2xl shadow-2xl border border-amber-500/40 max-w-sm transition-all">
        <div class="flex items-start gap-3">
            <div class="p-2 bg-amber-500/20 text-amber-400 rounded-xl">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
            </div>
            <div class="flex-1">
                <h4 class="font-bold text-sm text-amber-400">¡Nueva versión disponible!</h4>
                <p class="text-xs text-slate-300 mt-0.5">Hay una actualización lista con mejoras en la tienda.</p>
                <div class="flex items-center gap-2 mt-3">
                    <button id="pwa-update-btn" class="px-3.5 py-1.5 bg-amber-500 hover:bg-amber-400 text-emerald-950 font-bold rounded-xl text-xs transition-colors shadow-sm">
                        Actualizar ahora
                    </button>
                    <button onclick="document.getElementById('pwa-update-banner').classList.add('hidden')" class="px-3 py-1.5 text-slate-400 hover:text-white text-xs">
                        Más tarde
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <main class="flex-grow">
        
        <!-- PAGE 1: INICIO -->
        <section id="page-inicio" class="page-view animate-fade-in">
            <!-- Contenido previo de inicio... -->
        </section>

        <!-- PAGE 2: PRODUCTOS -->
        <section id="page-productos" class="page-view hidden animate-fade-in">
            <!-- Contenido previo de catálogo... -->
        </section>

        <!-- PAGE 3: POLÍTICAS -->
        <section id="page-politicas" class="page-view hidden animate-fade-in">
            <!-- Contenido previo de políticas... -->
        </section>

        <!-- PAGE 4: ADMIN (Panel de Alta de Productos) -->
        <section id="page-admin" class="page-view hidden animate-fade-in">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-6">
                        <h1 class="font-serif text-2xl font-bold text-emerald-950">Alta de Nuevo Producto</h1>
                        <span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full">Panel Admin</span>
                    </div>

                    <form id="add-product-form" onsubmit="saveProduct(event)" class="space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs font-bold text-slate-600 uppercase">Nombre del producto</label>
                                <input type="text" id="prod-name" required class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-800">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-600 uppercase">Precio ($)</label>
                                <input type="number" id="prod-price" required class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-800">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs font-bold text-slate-600 uppercase">Categoría</label>
                                <select id="prod-category" class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-800">
                                    <option value="Remeras">Remeras</option>
                                    <option value="Vestidos">Vestidos</option>
                                    <option value="Pantalones">Pantalones</option>
                                    <option value="Camperas">Camperas</option>
                                    <option value="Tops">Tops</option>
                                    <option value="Calzados">Calzados</option>
                                    <option value="Accesorios">Accesorios</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-600 uppercase">URL de Imagen</label>
                                <input type="url" id="prod-image" placeholder="https://..." required class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-800">
                            </div>
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-600 uppercase">Talles disponibles (separados por coma)</label>
                            <input type="text" id="prod-sizes" placeholder="S, M, L, XL" required class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-800">
                        </div>

                        <button type="submit" class="w-full py-3 bg-emerald-900 hover:bg-emerald-950 text-white font-bold rounded-xl transition-all shadow-md mt-4">
                            Guardar Producto
                        </button>
                    </form>
                </div>
            </div>
        </section>

    </main>

    <!-- AUTH MODAL -->
    <div id="auth-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div class="w-12 h-12 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4 text-emerald-900">
                <i data-lucide="user" class="w-6 h-6"></i>
            </div>
            <h3 class="font-serif text-xl font-bold text-slate-900 mb-2">Ingresar a GIBBOR</h3>
            <p class="text-xs text-slate-500 mb-6">Iniciá sesión para guardar tus favoritos y gestionar compras.</p>
            
            <button onclick="loginGoogle()" class="w-full py-3 bg-white border border-slate-300 hover:bg-slate-50 rounded-xl font-medium text-sm text-slate-700 flex items-center justify-center gap-3 shadow-sm transition-all">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Continuar con Google</span>
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/auth.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pwa.js"></script>
</body>
</html>
